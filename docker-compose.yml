version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bookstack_db
    networks:
      - bookstack-network
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bookstack_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bookstackapp}
      MYSQL_USER: ${MYSQL_USER:-bookstack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bookstack_secret}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-bookstack_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Remove port 3306 exposure if not needed for security
    # ports:
    #   - "3306:3306"

  bookstack:
    image: lscr.io/linuxserver/bookstack:latest
    container_name: bookstack
    networks:
      - bookstack-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
      - APP_URL=${APP_URL:-http://localhost:6875}
      - APP_KEY=${APP_KEY}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USERNAME=${MYSQL_USER:-bookstack}
      - DB_PASSWORD=${MYSQL_PASSWORD:-bookstack_secret}
      - DB_DATABASE=${MYSQL_DATABASE:-bookstackapp}
    volumes:
      - bookstack_config:/config
    ports:
      - "6875:80"
    restart: unless-stopped

networks:
  bookstack-network:
    driver: bridge

volumes:
  db_data:
  bookstack_config:

